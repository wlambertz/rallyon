title: "Create Tournament Draft"
status: implemented
epic: "Tournament Setup"
ticket:
  title: "Create Tournament Draft"
  description: |
    Creates a new tournament draft with initial configuration.
    The user provides basic tournament details (name, dates, visibility)
    and the system creates a draft tournament in DRAFT status.
    The draft can then be updated with further configuration.

  acceptanceCriteria:
    - given: "valid tournament name and date range"
      when: "POST /api/tournamentmgmt/setup/configuration/tournaments is called"
      then: "201 Created with tournament draft in DRAFT status"
    - given: "missing required fields (name, dates)"
      when: "POST endpoint is called"
      then: "400 Bad Request with validation errors"
    - given: "invalid date range (end before start)"
      when: "POST endpoint is called"
      then: "400 Bad Request"

