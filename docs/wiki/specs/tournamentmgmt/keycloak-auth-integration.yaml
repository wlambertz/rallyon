      type: "development"
      references: ["3rd_party/iam/"]
      codeReferences: ["3rd_party/iam"]
    - text: "Role mapping from Keycloak roles to Spring Security"
      type: "development"
      references: ["3rd_party/iam/"]
      codeReferences: ["3rd_party/iam"]
    - text: "Security auto-configuration for Spring Boot"
      type: "development"
