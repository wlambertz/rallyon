      codeReferences: ["UpdateDraftService.kt"]
    - text: "DraftUpdateConflictException for version conflicts"
      type: "development"
      references: ["service/tournamentmgmt/src/main/kotlin/dev/wlambertz/rallyon/tournamentmgmt/setup/configuration/internal/DraftUpdateConflictException.kt"]
      codeReferences: ["DraftUpdateConflictException.kt"]
    - text: "TournamentNotFoundException for missing tournaments"
      type: "development"
      references: ["service/tournamentmgmt/src/main/kotlin/dev/wlambertz/rallyon/tournamentmgmt/setup/configuration/internal/TournamentNotFoundException.kt"]
      codeReferences: ["TournamentNotFoundException.kt"]
    - text: "InvalidDraftUpdateException for invalid state transitions"
      type: "development"
