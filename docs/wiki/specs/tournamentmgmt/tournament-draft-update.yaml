specification: "tournament-draft-update"
title: "Update Tournament Draft"
status: implemented
epic: "Tournament Setup"
ticket:
  title: "Update Tournament Draft"
  description: |
    Updates an existing tournament draft with new configuration.
    Supports partial updates with conflict detection via versioning.
    The draft must be in DRAFT status to be updated.

  acceptanceCriteria:
    - given: "valid tournament ID and updated configuration"
      when: "PUT /api/tournamentmgmt/setup/configuration/tournaments/{id} is called"
      then: "200 OK with updated tournament draft"
    - given: "tournament not in DRAFT status"
      when: "PUT endpoint is called"
      then: "409 Conflict"
    - given: "version mismatch (concurrent update)"
      when: "PUT endpoint is called with stale version"
      then: "409 Conflict (DraftUpdateConflictException)"
    - given: "tournament not found"
      when: "PUT endpoint is called with unknown ID"
      then: "404 Not Found (TournamentNotFoundException)"

  implementationSteps:
