name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/tournamentmgmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install shared IAM modules
        run: ./mvnw -B -f ../../3rd_party/iam/pom.xml install

      - name: "Run unit and integration tests (Gate 1: blocks merge)"
        run: ./mvnw -B test

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: service/tournamentmgmt/target/surefire-reports/*.xml

  modulith:
    name: Verify Modulith application modules
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/tournamentmgmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Install shared IAM modules
        run: ./mvnw -B -f ../../3rd_party/iam/pom.xml install

      - name: Verify application module structure
        run: ./mvnw -B verify -Pmodulith
