name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flyway_test
          POSTGRES_USER: flyway_test
          POSTGRES_PASSWORD: flyway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyway_test -d flyway_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Match <java.version> in service/tournamentmgmt/pom.xml and the Docker workflow.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x service/tournamentmgmt/mvnw

      - name: Install shared IAM modules
        run: ./service/tournamentmgmt/mvnw -B -f 3rd_party/iam/pom.xml install

      # TournamentmgmtModuleStructureTest runs ApplicationModules.verify() as part of
      # the normal test phase, so no separate Modulith job or profile is needed.
      - name: "Build, test, and verify module structure (Gate 1: blocks merge)"
        env:
          RALLYON_FLYWAY_TEST_URL: jdbc:postgresql://localhost:5432/flyway_test
          RALLYON_FLYWAY_TEST_USER: flyway_test
          RALLYON_FLYWAY_TEST_PASSWORD: flyway_test
          RALLYON_FLYWAY_TEST_ALLOW_MUTATION: "yes"
        run: ./service/tournamentmgmt/mvnw -B -f service/tournamentmgmt/pom.xml verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: service/tournamentmgmt/target/surefire-reports/*.xml
