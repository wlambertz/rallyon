name: Security scan & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x service/tournamentmgmt/mvnw

      - name: Install shared IAM modules
        run: ./service/tournamentmgmt/mvnw -B -f 3rd_party/iam/pom.xml install

      # Dependency-Check identifies libraries from jar files; without resolved jars it
      # only sees the pom and misses transitive dependencies.
      - name: Resolve runtime dependencies
        run: >-
          ./service/tournamentmgmt/mvnw -B -f service/tournamentmgmt/pom.xml dependency:copy-dependencies -DincludeScope=runtime

      # Pinned to a commit SHA: the action runs with repository access, so a mutable
      # ref like @main would run whatever upstream pushes next.
      # The action has no fail-on-CVSS input; extra CLI flags go through `args`.
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main, 2026-10-27
        env:
          # setup-java's runner path does not exist inside the action container.
          JAVA_HOME: /opt/jdk
        with:
          project: rallyon-tournamentmgmt
          path: service/tournamentmgmt/target/dependency
          format: HTML
          out: reports
          args: --format JSON --failOnCVSS 7

      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x service/tournamentmgmt/mvnw

      - name: Install shared IAM modules
        run: ./service/tournamentmgmt/mvnw -B -f 3rd_party/iam/pom.xml install

      - name: Generate CycloneDX SBOM
        run: >-
          ./service/tournamentmgmt/mvnw -B -f service/tournamentmgmt/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Publish SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: service/tournamentmgmt/target/bom.json
