name: Security scan & SBOM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # weekly, Mondays

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/tournamentmgmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'rallyon-tournamentmgmt'
          path: service/tournamentmgmt
          failBuildOnCVSS: 7
          format: 'HTML,JSON'

      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: service/tournamentmgmt/dependency-check-report.*

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: dependency-scan
    defaults:
      run:
        working-directory: service/tournamentmgmt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Generate CycloneDX SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.8.4:makeAggregateBom

      - name: Publish SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: service/tournamentmgmt/target/bom.json
