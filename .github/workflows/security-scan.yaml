name: Security scan & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare dependency inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate suppression policy and security regression tests
        run: |
          python3 tools/scripts/validate_dependency_suppressions.py .github/dependency-check-suppressions.xml
          python3 -m unittest discover -s tools/scripts/tests -p 'test_security*.py' -v
      - name: Install shared IAM modules
        run: ./service/tournamentmgmt/mvnw -B -f 3rd_party/iam/pom.xml install
      # Repository layout preserves exact group/artifact/version identities beside JAR hashes.
      - name: Resolve runtime dependencies
        run: >-
          ./service/tournamentmgmt/mvnw -B -f service/tournamentmgmt/pom.xml dependency:copy-dependencies -DincludeScope=runtime -Dmdep.useRepositoryLayout=true -DoutputDirectory=${{ github.workspace }}/security-input/dependencies
      - name: Record prepared source and inputs
        run: >-
          python3 tools/scripts/security_scan.py --dependencies security-input/dependencies --revision "$GITHUB_SHA" --write-inventory security-input/inventory.json
      - name: Publish prepared inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-input-${{ github.run_id }}-${{ github.sha }}
          path: security-input/
          if-no-files-found: error
          retention-days: 7

  dependency-scan:
    name: Dependency vulnerability scan
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download prepared inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-input-${{ github.run_id }}-${{ github.sha }}
          path: security-input
      # Restore/save are separate: PRs can consume default-branch data but cannot publish it.
      - name: Restore compatible vulnerability data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-13.0.0-0e8f69ad-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-13.0.0-0e8f69ad-data-${{ runner.os }}-
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ ((github.event_name == 'push' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && secrets.NVD_API_KEY || '' }}
        run: >-
          python3 tools/scripts/security_scan.py --dependencies security-input/dependencies --manifest security-input/inventory.json --revision "$GITHUB_SHA" --data "$RUNNER_TEMP/dependency-check-data" --reports reports --suppressions .github/dependency-check-suppressions.xml
      - name: Save trusted vulnerability data
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-13.0.0-0e8f69ad-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report-${{ github.run_id }}-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download prepared inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-input-${{ github.run_id }}-${{ github.sha }}
          path: security-input
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install shared IAM modules
        run: ./service/tournamentmgmt/mvnw -B -f 3rd_party/iam/pom.xml install
      - name: Generate CycloneDX SBOM
        run: >-
          ./service/tournamentmgmt/mvnw -B -f service/tournamentmgmt/pom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Compare prepared runtime inventory with SBOM
        run: >-
          python3 tools/scripts/security_scan.py --dependencies security-input/dependencies --manifest security-input/inventory.json --compare-bom service/tournamentmgmt/target/bom.json > service/tournamentmgmt/target/bom-comparison.json
      - name: Publish SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.run_id }}-${{ github.sha }}
          path: |
            service/tournamentmgmt/target/bom.json
            service/tournamentmgmt/target/bom-comparison.json
            security-input/inventory.json
          if-no-files-found: warn
          retention-days: 14
