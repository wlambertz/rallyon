<!-- @dsCard group="Type" viewport="700x180" subtitle="IBM Plex Sans — body & UI at 15px default" name="Body / IBM Plex Sans" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--paper-1); color:var(--ink-1); font-family:var(--font-sans); }
  .row { display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:baseline; border-bottom:1px solid var(--line); padding:8px 0; }
  .row:last-child { border-bottom:0; }
  .tag { font:var(--type-label); letter-spacing:var(--tracking-caps); color:var(--ink-2); }
</style></head>
<body>
  <div class="row"><span class="tag">BODY / 15</span><span style="font-size:15px">Feld 3 ist frei. Das nächste Spiel kann angesetzt werden.</span></div>
  <div class="row"><span class="tag">STRONG / 15</span><span style="font-size:15px;font-weight:600;color:var(--ink-0)">Ergebnis gespeichert</span></div>
  <div class="row"><span class="tag">SMALL / 13</span><span style="font-size:13px">Gruppe A · Runde 2 von 5 · Kaiser-System</span></div>
</body></html>
