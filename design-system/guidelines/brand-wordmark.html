<!-- @dsCard group="Brand" viewport="700x160" subtitle="No logo supplied — wordmark set in Space Grotesk" name="Wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--paper-1); font-family:var(--font-display); display:flex; gap:40px; align-items:center; }
  .mark { display:inline-flex; align-items:center; gap:0; }
  .mark .r { background:var(--ink-0); color:var(--paper-1); font-weight:700; font-size:32px; padding:2px 10px; letter-spacing:-0.02em; }
  .mark .name { font-weight:700; font-size:32px; letter-spacing:-0.03em; color:var(--ink-0); padding-left:10px; }
  .mark .name span { color:var(--accent); }
  .lock { display:flex; flex-direction:column; gap:4px; }
  .tag { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-caps); color:var(--ink-2); }
</style></head>
<body>
  <div class="lock">
    <div class="mark"><span class="r">RO</span><span class="name">Rally<span>On</span></span></div>
    <span class="tag">das smarte System für Badmintonturniere</span>
  </div>
  <div class="mark" style="background:var(--ink-0);padding:12px 16px"><span class="name" style="color:var(--paper-1)">Rally<span>On</span></span></div>
</body></html>
