<!-- @dsCard group="Colors" viewport="700x170" subtitle="Industrial orange — rare highlight for LIVE / in-progress only" name="Operational accent" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-mono); background: var(--paper-1); }
  .row { display:flex; gap:0; padding:20px; }
  .sw { flex:1; height:110px; border:var(--bw) solid var(--line-strong); border-left:0; display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .sw:first-child { border-left:var(--bw) solid var(--line-strong); }
  .name { font-size:11px; font-weight:600; }
  .val { font-size:10px; opacity:.75; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--accent);color:var(--accent-on)"><span class="name">accent</span><span class="val">#FF5C2B</span></div>
    <div class="sw" style="background:var(--accent-hover);color:#fff"><span class="name">accent-hover</span><span class="val">#E84A1B</span></div>
    <div class="sw" style="background:var(--accent-press);color:#fff"><span class="name">accent-press</span><span class="val">#CC3F14</span></div>
    <div class="sw" style="background:var(--accent-soft);color:var(--ink-0);border-color:var(--accent-line)"><span class="name">accent-soft</span><span class="val">#FFE6DB</span></div>
  </div>
</body></html>
