<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base grid — s-1 → s-16" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--paper-1); font-family:var(--font-mono); display:flex; align-items:flex-end; gap:16px; }
  .item { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar { background:var(--accent); border:1.5px solid var(--line-strong); }
  .lbl { font-size:10px; color:var(--ink-2); }
  .lbl b { color:var(--ink-0); display:block; font-size:11px; }
</style></head>
<body>
  <div class="item"><div class="bar" style="width:4px;height:4px"></div><span class="lbl"><b>s-1</b>4</span></div>
  <div class="item"><div class="bar" style="width:8px;height:8px"></div><span class="lbl"><b>s-2</b>8</span></div>
  <div class="item"><div class="bar" style="width:12px;height:12px"></div><span class="lbl"><b>s-3</b>12</span></div>
  <div class="item"><div class="bar" style="width:16px;height:16px"></div><span class="lbl"><b>s-4</b>16</span></div>
  <div class="item"><div class="bar" style="width:24px;height:24px"></div><span class="lbl"><b>s-6</b>24</span></div>
  <div class="item"><div class="bar" style="width:32px;height:32px"></div><span class="lbl"><b>s-8</b>32</span></div>
  <div class="item"><div class="bar" style="width:48px;height:48px"></div><span class="lbl"><b>s-12</b>48</span></div>
  <div class="item"><div class="bar" style="width:64px;height:64px"></div><span class="lbl"><b>s-16</b>64</span></div>
</body></html>
