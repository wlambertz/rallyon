<!-- @dsCard group="Colors" viewport="700x150" subtitle="Terminal theme for the Turnier-TV big screen" name="Dark terminal" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-mono); background: var(--paper-0); }
  .row { display:flex; gap:0; padding:20px; }
  .sw { flex:1; height:96px; border:var(--bw) solid var(--line-strong); border-left:0; display:flex; flex-direction:column; justify-content:flex-end; padding:8px; color:var(--ink-0); }
  .sw:first-child { border-left:var(--bw) solid var(--line-strong); }
  .name { font-size:11px; font-weight:600; }
  .val { font-size:10px; color:var(--ink-2); }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--paper-0)"><span class="name">paper-0</span><span class="val">#0A0A09</span></div>
    <div class="sw" style="background:var(--paper-1)"><span class="name">paper-1</span><span class="val">#121210</span></div>
    <div class="sw" style="background:var(--paper-2)"><span class="name">paper-2</span><span class="val">#1B1B17</span></div>
    <div class="sw" style="background:var(--accent);color:var(--accent-on)"><span class="name">accent</span><span class="val">#FF6A3C</span></div>
    <div class="sw" style="background:var(--paper-2);color:var(--ink-0)"><span class="name" style="color:var(--ink-0)">ink-0</span><span class="val">#F5F3EC</span></div>
  </div>
</body></html>
