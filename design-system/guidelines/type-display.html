<!-- @dsCard group="Type" viewport="700x200" subtitle="Space Grotesk — display & headings, tight tracking" name="Display / Space Grotesk" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--paper-1); color:var(--ink-0); }
  .line { display:flex; align-items:baseline; gap:16px; border-bottom:1px solid var(--line); padding:8px 0; }
  .line:last-child { border-bottom:0; }
  .tag { font:var(--type-label); letter-spacing:var(--tracking-caps); color:var(--ink-2); width:120px; flex:0 0 120px; }
  .spec { font-family:var(--font-display); color:var(--ink-0); letter-spacing:var(--tracking-tight); }
</style></head>
<body>
  <div class="line"><span class="tag">DISPLAY / 48</span><span class="spec" style="font-size:48px;font-weight:700">Turnier</span></div>
  <div class="line"><span class="tag">H1 / 36</span><span class="spec" style="font-size:36px;font-weight:700">Ergebnis erfassen</span></div>
  <div class="line"><span class="tag">H2 / 28</span><span class="spec" style="font-size:28px;font-weight:600">Feld-Manifest</span></div>
  <div class="line"><span class="tag">H3 / 22</span><span class="spec" style="font-size:22px;font-weight:600">Schnellaktionen</span></div>
</body></html>
