<!-- @dsCard group="Colors" viewport="700x150" subtitle="Warm paper stock — app, panel, card surfaces" name="Paper / neutrals" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family: var(--font-mono); background: var(--paper-1); }
  .row { display:flex; gap:0; padding:20px; }
  .sw { flex:1; height:96px; border:var(--bw) solid var(--line-strong); border-left:0; display:flex; flex-direction:column; justify-content:flex-end; padding:8px; }
  .sw:first-child { border-left:var(--bw) solid var(--line-strong); }
  .name { font-size:11px; font-weight:600; color:var(--ink-0); }
  .val { font-size:10px; color:var(--ink-2); }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--paper-0)"><span class="name">paper-0</span><span class="val">#EAE8E0</span></div>
    <div class="sw" style="background:var(--paper-1)"><span class="name">paper-1</span><span class="val">#F5F3EC</span></div>
    <div class="sw" style="background:var(--paper-2)"><span class="name">paper-2</span><span class="val">#FCFBF6</span></div>
    <div class="sw" style="background:var(--line-soft)"><span class="name">line-soft</span><span class="val">#E1DED4</span></div>
    <div class="sw" style="background:var(--line)"><span class="name">line</span><span class="val">#CFCCC0</span></div>
  </div>
</body></html>
