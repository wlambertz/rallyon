<!-- @dsCard group="Motion" viewport="700x150" subtitle="120–160ms, no bounce · LIVE blink indicator" name="Motion & timing" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--paper-1); font-family:var(--font-mono); display:flex; gap:36px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .tag { font-size:10px; letter-spacing:var(--tracking-caps); color:var(--ink-2); }
  .val { font-size:20px; font-weight:600; color:var(--ink-0); }
  .live { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:var(--tracking-caps); color:var(--status-live); }
  .dot { width:10px; height:10px; background:var(--status-live); animation:ro-blink 1s steps(1) infinite; }
  .ease { width:180px; height:56px; border:1.5px solid var(--line-strong); position:relative; overflow:hidden; background:var(--paper-2); }
  .ball { position:absolute; top:50%; left:8px; width:14px; height:14px; margin-top:-7px; background:var(--accent); animation:slide 1.6s var(--ease-standard) infinite alternate; }
  @keyframes slide { to { left:158px; } }
</style></head>
<body>
  <div class="col"><span class="tag">DUR-1</span><span class="val">120ms</span></div>
  <div class="col"><span class="tag">DUR-2</span><span class="val">160ms</span></div>
  <div class="col"><span class="tag">EASE-STANDARD</span><div class="ease"><div class="ball"></div></div></div>
  <div class="col"><span class="tag">LIVE INDICATOR</span><span class="live"><span class="dot"></span>LIVE · SATZ 2</span></div>
</body></html>
