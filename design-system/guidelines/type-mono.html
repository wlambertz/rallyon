<!-- @dsCard group="Type" viewport="700x180" subtitle="IBM Plex Mono — data, IDs & uppercase labels" name="Mono / labels" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--paper-1); color:var(--ink-0); font-family:var(--font-mono); }
  .row { display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:baseline; border-bottom:1px solid var(--line); padding:8px 0; }
  .row:last-child { border-bottom:0; }
  .tag { font-size:11px; font-weight:600; letter-spacing:var(--tracking-caps); color:var(--ink-2); }
</style></head>
<body>
  <div class="row"><span class="tag">LABEL</span><span style="font-size:11px;font-weight:600;letter-spacing:var(--tracking-caps)">STATUS · FELD-MANIFEST · LIVE</span></div>
  <div class="row"><span class="tag">DATA / 13</span><span style="font-size:13px;font-weight:500">14:30 · Feld 5 · Satz 2</span></div>
  <div class="row"><span class="tag">ID</span><span style="font-size:13px;font-weight:500;color:var(--ink-1)">T-2026-014 · M-104</span></div>
</body></html>
