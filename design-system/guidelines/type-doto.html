<!-- @dsCard group="Type" viewport="700x190" subtitle="Doto — dot-matrix numerals for scoreboards only" name="Scoreboard / Doto" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--paper-0); color:var(--ink-0); font-family:var(--font-mono); display:flex; align-items:center; gap:32px; }
  .board { display:flex; align-items:baseline; gap:14px; }
  .num { font-family:var(--font-dot); font-weight:900; font-size:96px; line-height:.9; color:var(--ink-0); }
  .sep { font-family:var(--font-dot); font-weight:700; font-size:64px; color:var(--ink-2); }
  .win { color:var(--accent); }
  .meta { font-size:11px; letter-spacing:var(--tracking-caps); color:var(--ink-2); }
</style></head>
<body>
  <div class="board">
    <span class="num win">21</span><span class="sep">:</span><span class="num">18</span>
  </div>
  <div>
    <div class="meta" style="margin-bottom:8px">DOTO · WEIGHT 900</div>
    <div style="font-family:var(--font-dot);font-weight:500;font-size:28px;color:var(--ink-1)">0123456789</div>
  </div>
</body></html>
